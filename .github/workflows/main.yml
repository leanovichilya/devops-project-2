name: Project 2
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_USER: user
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app
        run: python app.py &
        env:
          DB_HOST: localhost
          DB_PASSWORD: pass
          DB_USER: user
          DB_NAME: mydb

      - name: Wait for app
        run: sleep 3 

      - name: Test endpoint
        run: curl http://localhost:5000/home

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build docker image
        run: docker build -t project-2 .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to server
        run: |
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          echo "$ENV_FILE" > .env
          scp -i key.pem -o StrictHostKeyChecking=no Dockerfile ubuntu@$EC2_HOST:~/
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.yml ubuntu@$EC2_HOST:~/
          scp -i key.pem -o StrictHostKeyChecking=no app.py ubuntu@$EC2_HOST:~/
          scp -i key.pem -o StrictHostKeyChecking=no requirements.txt ubuntu@$EC2_HOST:~/
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "cd ~ && docker compose up -d --build"
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
